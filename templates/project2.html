<!DOCTYPE html>
<html>
<head>
    <title>Loan Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg">

    <div class="form-container">
        <h1>Loan Prediction</h1>
        <form method="post" id="predict-form">
                                <div class="gif">
        <img src="https://lh3.googleusercontent.com/d/1JQGJS7JBfvUP4xcUmk3cSLPupaDtbGWj
" alt="gif" width="100" height="80">
    </div>
 <!-- Numeric Inputs -->
            <p>Age:<br> <input type="number" name="person_age" required step="any"></p>
            <p>Income: <br><input type="number" name="person_income" required step="any"></p>
            <p>Employment Experience (years): <br><input type="number" name="person_emp_exp" required step="any"></p>
            <p>Loan Percent of Income (between 0 and 1):<br> <input type="number" name="loan_percent_income" required step="any"></p>
            <p>Credit History Length (months):<br> <input type="number" name="cb_person_cred_hist_length" required step="any"></p>
            <p>Credit Score:<br> <input type="number" name="credit_score" required step="any"></p>


            <!-- Gender -->
            <p>Gender:<br>
                <select name="person_gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </p>

            <!-- Education -->
            <p>Education:<br>
                <select name="person_education">
                    <option value="Associate">Associate</option>
                    <option value="Bachelor">Bachelor</option>
                    <option value="Doctorate">Doctorate</option>
                    <option value="High School">High School</option>
                    <option value="Master">Master</option>
                </select>
            </p>

            <!-- Home Ownership -->
            <p>Home Ownership:<br>
                <select name="person_home_ownership">
                    <option value="MORTGAGE">MORTGAGE</option>
                    <option value="OTHER">OTHER</option>
                    <option value="OWN">OWN</option>
                    <option value="RENT">RENT</option>
                </select>
            </p>

            <!-- Loan Intent -->
            <p>Loan Purpose:<br>
                <select name="loan_intent">
                    <option value="DEBTCONSOLIDATION">Debt Consolidation</option>
                    <option value="EDUCATION">Education</option>
                    <option value="HOMEIMPROVEMENT">Home Improvement</option>
                    <option value="MEDICAL">Medical</option>
                    <option value="PERSONAL">Personal</option>
                    <option value="VENTURE">Venture</option>
                </select>
            </p>

            <!-- Previous Defaults -->
            <p>Previous Loan Defaults:<br>
                <select name="previous_loan_defaults_on_file">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </p>

            <!-- Bank -->
            <p>Bank:<br>
                <select name="Bank">
                    <option value="ABB bank">ABB bank</option>
                    <option value="Access bank">Access bank</option>
                    <option value="Azer-Turk bank">Azer-Turk bank</option>
                    <option value="Bank Respublika">Bank Respublika</option>
                    <option value="Kapital bank">Kapital bank</option>
                    <option value="Pasha bank">Pasha bank</option>
                    <option value="Unibank">Unibank</option>
                    <option value="Xalq bank">Xalq bank</option>
                    <option value="Ziraat bank">Ziraat bank</option>
                </select>
            </p>

            <!-- Submit -->
            <input type="submit" value="Predict">
        <h3>{{ prediction }}</h3>
        <h3>{{ error_msg }}</h3>
        </form>

        <!-- Prediction Output -->

    </div>
</body>
</html>
